{% extends "base.html" %}

{% block content %}
<h2 class="text-xl font-bold text-blue-900 mb-6">Dashboard Statistik & Grafik Tren</h2>

<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
        <p class="text-xs font-bold text-gray-500">TOTAL SISWA</p>
        <p class="text-2xl font-bold text-blue-600 mt-1">{{ total_siswa }}</p>
    </div>
    <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-500">
        <p class="text-xs font-bold text-gray-500">LAPORAN FINAL</p>
        <p class="text-2xl font-bold text-green-600 mt-1">{{ total_final }}</p>
    </div>
    <div class="bg-white p-4 rounded-lg shadow border-l-4 border-yellow-500">
        <p class="text-xs font-bold text-gray-500">LAPORAN DRAF</p>
        <p class="text-2xl font-bold text-yellow-600 mt-1">{{ total_draf }}</p>
    </div>
    <div class="bg-white p-4 rounded-lg shadow border-l-4 border-purple-500">
        <p class="text-xs font-bold text-gray-500">RATA-RATA NILAI</p>
        <p class="text-2xl font-bold text-purple-600 mt-1">{{ avg_nilai }}</p>
    </div>
</div>

<div class="bg-white p-6 rounded-lg shadow border">
    <h3 class="text-md font-bold text-blue-900 mb-4">Grafik Tren Nilai & Presensi Per Bulan</h3>
    <canvas id="trendChart" class="w-full max-h-80"></canvas>
</div>

<script>
const ctx = document.getElementById('trendChart').getContext('2d');
new Chart(ctx, {
    type: 'line',
    data: {
        labels: ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni'],
        datasets: [{
            label: 'Rata-Rata Nilai Akademik',
            data: [82, 85, 84, 88, 90, 89],
            borderColor: '#2563EB',
            backgroundColor: 'rgba(37, 99, 235, 0.1)',
            fill: true,
            tension: 0.3
        }]
    }
});
</script>
{% endblock %}
